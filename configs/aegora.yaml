server:
  addr: "127.0.0.1:8080"
  read_timeout: "30s"
  write_timeout: "30s"
  idle_timeout: "60s"
  # max_request_body_bytes: 10485760 # 10 MB; unset or 0 = unlimited

routes:
  - name: "api-service"
    path_prefix: "/api"
    methods:
      - "GET"
      - "POST"
    targets:
      - "http://127.0.0.1:8081"
    strip_prefix: "/api"
    lb: "round_robin"
    # Optional per-route override of the global rate_limit block (unset fields are inherited):
    # rate_limit:
    #   max_requests: 30
  - name: "web-service"
    path_prefix: "/"
    targets:
      - "http://127.0.0.1:3000"
    lb: "least_connections"

observability:
  log_level: "info"
  metrics_addr: "127.0.0.1:9090"
  tracing:
    enabled: false
    exporter: "stdout" # or "otlp"
    otlp_endpoint: "localhost:4318"
    sample_ratio: 1.0

admin:
  enabled: false
  addr: "127.0.0.1:9091"

rate_limit:
  enabled: true
  limiter: "sliding_window"
  max_requests: 60
  window: "1m"
  key: "ip"

reliability:
  breaker_failure_threshold: 5
  breaker_cooldown: "30s"
  retry_enabled: true
  retry_max_attempts: 3
  retry_initial_delay: "100ms"

queue:
  enabled: false
  max_inflight: 200
  max_queue_depth: 1000
  codel_target: "100ms"
  codel_interval: "1s"
  priority_paths:
    high: ["/api/payments"]
    low: ["/api/analytics"]

shedding:
  enabled: false
  target_p99: "500ms"
  min_admit_rate: 0.05
  adjust_interval: "1s"
  priority_paths:
    high: ["/api/payments"]
    low: ["/api/analytics"]

cache:
  enabled: false
  ttl: "60s" # L1 TTL
  l2_enabled: false
  l2_ttl: "5m"
  redis_addr: "127.0.0.1:6379"
  max_entries: 10000
  max_body_bytes: 1048576
